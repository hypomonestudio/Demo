name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit,
  # which is what you want after fixing DNS or Pages settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so a
# finished build is not thrown away mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site currently lives at hypomonestudio.github.io/Demo/, not at
      # the root of a domain, so every asset URL has to carry that prefix.
      # Without it the HTML loads and asks for /_next/... which 404s, and
      # the page renders as unstyled text.
      #
      # Delete this env block the moment hypomone-studio.site resolves and
      # the custom domain is set in Settings, because then the site is
      # served from the root and the prefix becomes wrong in the other
      # direction.
      - run: npm run build
        env:
          PAGES_BASE_PATH: /Demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
